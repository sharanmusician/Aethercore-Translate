<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core Translate - Aethercore Interactive</title>
    <style>
        :root {
            --primary-color: #1a73e8;
            --primary-hover: #1557b0;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --border-color: #dadce0;
            --text-main: #202124;
            --text-secondary: #5f6368;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-container h1 {
            font-size: 22px;
            font-weight: 400;
            margin: 0;
            color: var(--text-main);
        }

        .brand-container span {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
            display: block;
        }

        main {
            flex: 1;
            padding: 32px 16px;
            max-width: 1024px;
            width: 100%;
            margin: 0 auto;
            box-sizing: border-box;
        }

        /* Language bar styling mimicking Google Translate dropdown selector */
        .language-bar {
            display: flex;
            gap: 16px;
            align-items: center;
            margin-bottom: 16px;
            background: var(--card-bg);
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3);
        }

        .language-bar select {
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            outline: none;
            background-color: #fff;
            color: var(--text-main);
            cursor: pointer;
            flex: 1;
        }

        .language-bar label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .translator-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
            overflow: hidden;
            min-height: 350px;
        }

        .translator-pane {
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .translator-pane:first-child {
            border-right: 1px solid var(--border-color);
            background-color: #fcfcfc;
        }

        .pane-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        textarea {
            width: 100%;
            height: 100%;
            min-height: 250px;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-family: inherit;
            resize: none;
            outline: none;
            box-sizing: border-box;
            background: transparent;
            color: var(--text-main);
        }

        .output-box {
            padding: 16px;
            font-size: 16px;
            color: var(--text-main);
            flex: 1;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .action-bar {
            padding: 12px 16px;
            display: flex;
            justify-content: flex-end;
            border-top: 1px solid var(--border-color);
            background: var(--card-bg);
            margin-top: 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        footer {
            text-align: center;
            padding: 16px;
            font-size: 12px;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-color);
            background-color: var(--card-bg);
        }

        /* Completely hide original Google Translate widget artifacts, banners, tooltips, and frames */
        .goog-te-banner-frame, 
        .goog-tooltip, 
        #goog-gt-tt, 
        .goog-te-gadget span,
        .goog-te-gadget img {
            display: none !important;
        }
        body {
            top: 0px !important;
            position: static !important;
        }
        .goog-text-highlight {
            background-color: transparent !important;
            box-shadow: none !important;
        }

        /* Style the actual Google Translate dropdown hidden inside container so it populates all native languages */
        .goog-te-combo {
            display: block !important;
            width: 100%;
            padding: 8px;
            font-size: 14px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background: #fff;
            color: var(--text-main);
        }

        /* Container wrapper for Google widget integration */
        #google_translate_element {
            display: block !important;
            opacity: 0;
            position: absolute;
            pointer-events: none;
            height: 0;
            overflow: hidden;
        }

        @media (max-width: 768px) {
            .translator-container {
                grid-template-columns: 1fr;
            }
            .translator-pane:first-child {
                border-right: none;
                border-bottom: 1px solid var(--border-color);
            }
            .language-bar {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-container">
            <h1>Core Translate</h1>
            <span>Aethercore Interactive</span>
        </div>
    </header>

    <main>
        <!-- Language Select Control Bar -->
        <div class="language-bar">
            <div>
                <label for="source-lang-select">From:</label>
                <select id="source-lang-select">
                    <option value="auto">Detect Language</option>
                    <option value="en" selected>English</option>
                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="zh-CN">Chinese (Simplified)</option>
                    <option value="ja">Japanese</option>
                </select>
            </div>
            <div style="flex: 1;">
                <label for="custom-target-select">To Language (Powered by Google Translate):</label>
                <!-- This dropdown mimics and binds cleanly to Google Translate's complete language set -->
                <select id="custom-target-select">
                    <option value="">Loading all Google languages...</option>
                </select>
            </div>
        </div>

        <div class="translator-container">
            <!-- Source Input Pane -->
            <div class="translator-pane">
                <div class="pane-header">Source Text</div>
                <textarea id="source-text" placeholder="Type text to translate..."></textarea>
            </div>

            <!-- Target Output Pane -->
            <div class="translator-pane">
                <div class="pane-header">Translated Output</div>
                <div id="target-output" class="output-box">Translation will appear here...</div>
            </div>
        </div>

        <div class="action-bar">
            <button id="translate-btn">Translate</button>
        </div>
    </main>

    <footer>
        &copy; 2026 Aethercore Interactive. All rights reserved.
    </footer>

    <!-- Hidden native Google Translate element to pull language choices and render background processing -->
    <div id="google_translate_element"></div>
    <div id="hidden-translation-mirror" style="display:none;"></div>

    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'en',
                autoDisplay: false
            }, 'google_translate_element');

            // Automatically bridge all native Google languages into our custom layout dropdown selector
            setTimeout(populateGoogleLanguages, 1000);
        }

        function populateGoogleLanguages() {
            const googleCombo = document.querySelector('.goog-te-combo');
            const customSelect = document.getElementById('custom-target-select');
            
            if (googleCombo && googleCombo.options.length > 1) {
                customSelect.innerHTML = '';
                for (let i = 0; i < googleCombo.options.length; i++) {
                    const opt = googleCombo.options[i];
                    if (opt.value) { // Filter out empty blank defaults
                        const newOption = document.createElement('option');
                        newOption.value = opt.value;
                        newOption.text = opt.text;
                        customSelect.appendChild(newOption);
                    }
                }
                if (customSelect.options.length === 0) {
                    fallbackLanguages(customSelect);
                }
            } else {
                fallbackLanguages(customSelect);
            }
        }

        function fallbackLanguages(selectElement) {
            selectElement.innerHTML = `
                <option value="es">Spanish</option>
                <option value="fr">French</option>
                <option value="de">German</option>
                <option value="zh-CN">Chinese (Simplified)</option>
                <option value="ja">Japanese</option>
                <option value="hi">Hindi</option>
                <option value="ar">Arabic</option>
                <option value="pt">Portuguese</option>
                <option value="ru">Russian</option>
                <option value="it">Italian</option>
                <option value="ko">Korean</option>
            `;
        }

        document.getElementById('translate-btn').addEventListener('click', function() {
            const textToTranslate = document.getElementById('source-text').value;
            const outputBox = document.getElementById('target-output');
            const selectedTargetLang = document.getElementById('custom-target-select').value;
            
            if (!textToTranslate.trim()) {
                outputBox.innerText = "Please enter text to translate.";
                return;
            }

            outputBox.innerText = "Translating...";

            // Apply selected language configuration onto the Google translation background session cookies
            document.cookie = `googtrans=/en/${selectedTargetLang}`;

            let hiddenContainer = document.getElementById('hidden-translation-mirror');
            hiddenContainer.innerText = textToTranslate;

            setTimeout(() => {
                let translatedResult = hiddenContainer.innerText;
                if (!translatedResult) {
                    translatedResult = textToTranslate;
                }
                outputBox.innerText = translatedResult;
            }, 600);
        });
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
                                                                        </html>
