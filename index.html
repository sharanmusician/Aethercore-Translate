<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core Translate - Aethercore Interactive</title>
    <style>
        :root {
            --bg-deep: #0b0f19;
            --bg-card: #131c2e;
            --border-color: #1e293b;
            --primary-accent: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-deep);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-container h1 {
            font-size: 20px;
            font-weight: 600;
            margin: 0;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .brand-container span {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
            display: block;
        }

        main {
            flex: 1;
            padding: 24px 16px;
            max-width: 1024px;
            width: 100%;
            margin: 0 auto;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .language-bar {
            display: flex;
            gap: 16px;
            align-items: flex-start;
            background: var(--bg-card);
            padding: 16px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            min-width: 240px;
            position: relative;
        }

        .control-group label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .searchable-select-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .search-input {
            padding: 10px 12px;
            font-size: 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            outline: none;
            background-color: var(--bg-deep);
            color: var(--text-main);
            width: 100%;
            box-sizing: border-box;
        }

        .search-input:focus {
            border-color: var(--primary-accent);
        }

        .control-group select {
            padding: 10px 12px;
            font-size: 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            outline: none;
            background-color: var(--bg-deep);
            color: var(--text-main);
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            height: 140px;
        }

        .translator-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .translator-pane {
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .translator-pane:first-child {
            border-right: 1px solid var(--border-color);
        }

        .pane-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.02);
        }

        textarea {
            width: 100%;
            min-height: 220px;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            outline: none;
            box-sizing: border-box;
            background: transparent;
            color: var(--text-main);
        }

        .output-box {
            padding: 16px;
            font-size: 16px;
            color: var(--text-main);
            flex: 1;
            white-space: pre-wrap;
            word-break: break-word;
            min-height: 220px;
            box-sizing: border-box;
        }

        .action-bar {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            align-items: center;
        }

        button {
            background-color: var(--primary-accent);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            width: 100%;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        footer {
            text-align: center;
            padding: 16px;
            font-size: 12px;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-color);
            background-color: var(--bg-card);
        }

        @media (max-width: 768px) {
            .translator-container {
                grid-template-columns: 1fr;
            }
            .translator-pane:first-child {
                border-right: none;
                border-bottom: 1px solid var(--border-color);
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-container">
            <h1>Core Translate</h1>
            <span>Aethercore Interactive</span>
        </div>
    </header>

    <main>
        <div class="language-bar">
            <!-- Source Language Search & Select -->
            <div class="control-group">
                <label for="source-search">From Language</label>
                <div class="searchable-select-wrapper">
                    <input type="text" id="source-search" class="search-input" placeholder="Search source language...">
                    <select id="source-lang-select" size="5">
                        <option value="auto">Detect Language</option>
                    </select>
                </div>
            </div>

            <!-- Target Language Search & Select -->
            <div class="control-group">
                <label for="target-search">To Language</label>
                <div class="searchable-select-wrapper">
                    <input type="text" id="target-search" class="search-input" placeholder="Search target language...">
                    <select id="custom-target-select" size="5">
                        <!-- Dynamically populated -->
                    </select>
                </div>
            </div>
        </div>

        <div class="translator-container">
            <div class="translator-pane">
                <div class="pane-header">Source Text</div>
                <textarea id="source-text" placeholder="Type or paste text to translate..."></textarea>
            </div>

            <div class="translator-pane">
                <div class="pane-header">Translated Output</div>
                <div id="target-output" class="output-box">Translation will appear here...</div>
            </div>
        </div>

        <div class="action-bar">
            <button id="translate-btn">Translate / Search</button>
        </div>
    </main>

    <footer>
        &copy; 2026 Aethercore Interactive. All rights reserved.
    </footer>

    <script>
        let allLanguagesData = {};

        // Fetch all supported Google Translate languages and populate selects
        async function loadLanguages() {
            try {
                const response = await fetch('/api/languages');
                allLanguagesData = await response.json();

                const sourceSelect = document.getElementById('source-lang-select');
                const targetSelect = document.getElementById('custom-target-select');

                // Keep 'Detect Language' option on source
                sourceSelect.innerHTML = '<option value="auto">Detect Language</option>';

                // Sort language names alphabetically
                const sortedLanguages = Object.entries(allLanguagesData)
                    .map(([code, name]) => ({ code, name }))
                    .sort((a, b) => a.name.localeCompare(b.name));

                sortedLanguages.forEach(({ code, name }) => {
                    // Skip 'auto' if present in map keys
                    if (code === 'auto') return;

                    const optSrc = document.createElement('option');
                    optSrc.value = code;
                    optSrc.text = name;
                    if (code === 'en') optSrc.selected = true; // Default source English
                    sourceSelect.appendChild(optSrc);

                    const optTgt = document.createElement('option');
                    optTgt.value = code;
                    optTgt.text = name;
                    if (code === 'es') optTgt.selected = true; // Default target Spanish
                    targetSelect.appendChild(optTgt);
                });

                // Attach filtering bindings after population
                setupLanguageSearch('source-search', 'source-lang-select', true);
                setupLanguageSearch('target-search', 'custom-target-select', false);

            } catch (err) {
                console.error("Failed to load language list:", err);
            }
        }

        // Real-time search/filter mechanism for options
        function setupLanguageSearch(searchId, selectId, includeAutoOption) {
            const searchInput = document.getElementById(searchId);
            const selectElement = document.getElementById(selectId);

            searchInput.addEventListener('input', function() {
                const term = searchInput.value.toLowerCase().trim();
                selectElement.innerHTML = '';

                if (includeAutoOption && 'detect language'.includes(term)) {
                    const autoOpt = document.createElement('option');
                    autoOpt.value = 'auto';
                    autoOpt.text = 'Detect Language';
                    selectElement.appendChild(autoOpt);
                }

                const sortedLanguages = Object.entries(allLanguagesData)
                    .map(([code, name]) => ({ code, name }))
                    .sort((a, b) => a.name.localeCompare(b.name));

                const filtered = sortedLanguages.filter(lang => lang.name.toLowerCase().includes(term));

                filtered.forEach(({ code, name }) => {
                    if (code === 'auto') return;
                    const opt = document.createElement('option');
                    opt.value = code;
                    opt.text = name;
                    selectElement.appendChild(opt);
                });

                // Highlight/select first item if choices exist
                if (selectElement.options.length > 0) {
                    selectElement.options[0].selected = true;
                }
            });
        }

        // Initialize language dropdown fetching on page load
        loadLanguages();

        // Translation Trigger Action
        document.getElementById('translate-btn').addEventListener('click', async function() {
            const textToTranslate = document.getElementById('source-text').value;
            const outputBox = document.getElementById('target-output');
            const sourceLang = document.getElementById('source-lang-select').value;
            const targetLang = document.getElementById('custom-target-select').value;
            
            if (!textToTranslate.trim()) {
                outputBox.innerText = "Please enter text to translate.";
                return;
            }

            outputBox.innerText = "Translating...";

            try {
                const response = await fetch('/api/translate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: textToTranslate,
                        source: sourceLang,
                        target: targetLang
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    outputBox.innerText = data.translatedText;
                } else {
                    outputBox.innerText = data.error || "Translation failed.";
                }
            } catch (err) {
                console.error(err);
                outputBox.innerText = "Network error occurred while connecting to server.";
            }
        });
    </script>
</body>
</html>
