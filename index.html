<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core Translate - Aethercore Interactive</title>
    <style>
        :root {
            --bg-deep: #0b0f19;
            --bg-card: #131c2e;
            --border-color: #1e293b;
            --primary-accent: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-deep);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-container h1 {
            font-size: 20px;
            font-weight: 600;
            margin: 0;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .brand-container span {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
            display: block;
        }

        main {
            flex: 1;
            padding: 24px 16px;
            max-width: 1024px;
            width: 100%;
            margin: 0 auto;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .language-bar {
            display: flex;
            gap: 12px;
            align-items: center;
            background: var(--bg-card);
            padding: 16px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            min-width: 200px;
        }

        .control-group label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .control-group select {
            padding: 10px 12px;
            font-size: 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            outline: none;
            background-color: var(--bg-deep);
            color: var(--text-main);
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
        }

        .translator-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .translator-pane {
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .translator-pane:first-child {
            border-right: 1px solid var(--border-color);
        }

        .pane-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.02);
        }

        textarea {
            width: 100%;
            min-height: 220px;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            outline: none;
            box-sizing: border-box;
            background: transparent;
            color: var(--text-main);
        }

        .output-box {
            padding: 16px;
            font-size: 16px;
            color: var(--text-main);
            flex: 1;
            white-space: pre-wrap;
            word-break: break-word;
            min-height: 220px;
            box-sizing: border-box;
        }

        .action-bar {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            align-items: center;
        }

        button {
            background-color: var(--primary-accent);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            width: 100%;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        footer {
            text-align: center;
            padding: 16px;
            font-size: 12px;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-color);
            background-color: var(--bg-card);
        }

        @media (max-width: 768px) {
            .translator-container {
                grid-template-columns: 1fr;
            }
            .translator-pane:first-child {
                border-right: none;
                border-bottom: 1px solid var(--border-color);
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-container">
            <h1>Core Translate</h1>
            <span>Aethercore Interactive</span>
        </div>
    </header>

    <main>
        <div class="language-bar">
            <div class="control-group">
                <label for="source-lang-select">From Language</label>
                <select id="source-lang-select">
                    <option value="auto">Detect Language</option>
                    <option value="en" selected>English</option>
                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="zh-CN">Chinese (Simplified)</option>
                    <option value="ja">Japanese</option>
                </select>
            </div>
            <div class="control-group">
                <label for="custom-target-select">To Language</label>
                <select id="custom-target-select">
                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="zh-CN">Chinese (Simplified)</option>
                    <option value="ja">Japanese</option>
                    <option value="hi">Hindi</option>
                    <option value="ar">Arabic</option>
                    <option value="pt">Portuguese</option>
                    <option value="ru">Russian</option>
                    <option value="it">Italian</option>
                    <option value="ko">Korean</option>
                </select>
            </div>
        </div>

        <div class="translator-container">
            <div class="translator-pane">
                <div class="pane-header">Source Text</div>
                <textarea id="source-text" placeholder="Type or paste text to translate..."></textarea>
            </div>

            <div class="translator-pane">
                <div class="pane-header">Translated Output</div>
                <div id="target-output" class="output-box">Translation will appear here...</div>
            </div>
        </div>

        <div class="action-bar">
            <button id="translate-btn">Translate / Search</button>
        </div>
    </main>

    <footer>
        &copy; 2026 Aethercore Interactive. All rights reserved.
    </footer>

    <script>
        document.getElementById('translate-btn').addEventListener('click', async function() {
            const textToTranslate = document.getElementById('source-text').value;
            const outputBox = document.getElementById('target-output');
            const sourceLang = document.getElementById('source-lang-select').value;
            const targetLang = document.getElementById('custom-target-select').value;
            
            if (!textToTranslate.trim()) {
                outputBox.innerText = "Please enter text to translate.";
                return;
            }

            outputBox.innerText = "Translating...";

            try {
                const response = await fetch('/api/translate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: textToTranslate,
                        source: sourceLang,
                        target: targetLang
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    outputBox.innerText = data.translatedText;
                } else {
                    outputBox.innerText = data.error || "Translation failed.";
                }
            } catch (err) {
                console.error(err);
                outputBox.innerText = "Network error occurred while connecting to server.";
            }
        });
    </script>
</body>
</html>
