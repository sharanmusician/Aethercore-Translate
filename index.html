<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core Translate - Aethercore Interactive</title>
    <style>
        /* Base Styling - Google Translate Clean Minimalist Aesthetic */
        :root {
            --primary-color: #1a73e8;
            --primary-hover: #1557b0;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --border-color: #dadce0;
            --text-main: #202124;
            --text-secondary: #5f6368;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-container {
            display: flex;
            flex-direction: column;
        }

        .brand-container h1 {
            font-size: 22px;
            font-weight: 400;
            margin: 0;
            color: var(--text-main);
        }

        .brand-container span {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        main {
            flex: 1;
            padding: 32px 16px;
            max-width: 1024px;
            width: 100%;
            margin: 0 auto;
            box-sizing: border-box;
        }

        /* Translate UI Layout */
        .translator-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
            overflow: hidden;
            min-height: 350px;
        }

        .translator-pane {
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .translator-pane:first-child {
            border-right: 1px solid var(--border-color);
            background-color: #fcfcfc;
        }

        .pane-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        textarea {
            width: 100%;
            height: 100%;
            min-height: 250px;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-family: inherit;
            resize: none;
            outline: none;
            box-sizing: border-box;
            background: transparent;
            color: var(--text-main);
        }

        .output-box {
            padding: 16px;
            font-size: 16px;
            color: var(--text-main);
            flex: 1;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .action-bar {
            padding: 12px 16px;
            display: flex;
            justify-content: flex-end;
            border-top: 1px solid var(--border-color);
            background: var(--card-bg);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        footer {
            text-align: center;
            padding: 16px;
            font-size: 12px;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-color);
            background-color: var(--card-bg);
        }

        /* Hide Google Translate Default UI Artifacts */
        .goog-te-banner-frame, .goog-tooltip, #goog-gt-tt, .goog-te-gadget span {
            display: none !important;
        }
        body {
            top: 0px !important;
            position: static !important;
        }
        .goog-text-highlight {
            background-color: transparent !important;
            box-shadow: none !important;
        }
        #google_translate_element {
            display: none;
        }

        @media (max-width: 768px) {
            .translator-container {
                grid-template-columns: 1fr;
            }
            .translator-pane:first-child {
                border-right: none;
                border-bottom: 1px solid var(--border-color);
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-container">
            <h1>Core Translate</h1>
            <span>Aethercore Interactive</span>
        </div>
    </header>

    <main>
        <div class="translator-container">
            <!-- Source Input Pane -->
            <div class="translator-pane">
                <div class="pane-header">Source Text</div>
                <textarea id="source-text" placeholder="Type text to translate..."></textarea>
            </div>

            <!-- Target Output Pane -->
            <div class="translator-pane">
                <div class="pane-header">Translated Output</div>
                <div id="target-output" class="output-box">Translation will appear here...</div>
            </div>
        </div>

        <div class="action-bar">
            <button id="translate-btn">Translate</button>
        </div>
    </main>

    <footer>
        &copy; 2026 Aethercore Interactive. All rights reserved.
    </footer>

    <!-- Hidden Google Translate Element -->
    <div id="google_translate_element"></div>

    <!-- Background Translation Logic -->
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'en',
                autoDisplay: false
            }, 'google_translate_element');
        }

        document.getElementById('translate-btn').addEventListener('click', function() {
            const textToTranslate = document.getElementById('source-text').value;
            const outputBox = document.getElementById('target-output');
            
            if (!textToTranslate.trim()) {
                outputBox.innerText = "Please enter some text to translate.";
                return;
            }

            // Setting up a temporary hidden element to utilize Google Translate in the background
            let hiddenContainer = document.getElementById('hidden-translation-mirror');
            if (!hiddenContainer) {
                hiddenContainer = document.createElement('div');
                hiddenContainer.id = 'hidden-translation-mirror';
                hiddenContainer.style.display = 'none';
                document.body.appendChild(hiddenContainer);
            }
            
            hiddenContainer.innerText = textToTranslate;
            outputBox.innerText = "Translating...";

            // Simulating real-time sync with background translation element
            setTimeout(() => {
                // Pulling translated innerText once Google Translate processes the node
                const translatedNode = hiddenContainer.innerText;
                outputBox.innerText = translatedNode;
            }, 600);
        });
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
